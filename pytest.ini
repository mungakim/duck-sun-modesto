[pytest]
# The test suite is tests/ only. scripts/ holds diagnostic scripts that are
# named test_*.py but assert nothing (they print for a person to read), and
# scripts/test_weathercom_scrape.py hits the live site, so on the MID network
# it always failed on the firewall's certificate. Run those directly:
#   .\venv\Scripts\python.exe scripts\test_weathercom_scrape.py
testpaths = tests

# pytest-asyncio warns on every run until this is set. No test uses an async
# fixture, so this only fixes the value its next major version defaults to.
asyncio_default_fixture_loop_scope = function
